<!-- MODAL: Add New Product -->
  <div id="create-product-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden">
    <div class="modal-dialog max-w-md w-full p-6 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div class="flex items-center space-x-2.5">
          <div class="w-8 h-8 rounded-xl bg-brand-surface text-brand flex items-center justify-center">
            <i data-lucide="package" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="text-base font-bold text-slate-900">Add Dairy Product</h3>
            <p class="text-[11px] text-slate-500">Create new item for customer subscriptions & catalog</p>
          </div>
        </div>
        <button onclick="closeCreateProductModal()" class="modal-close-btn">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Product Name *</label>
          <input type="text" id="prod-name" placeholder="e.g. Fresh Cow Milk 1L" class="admin-input" />
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Category</label>
            <select id="prod-category" class="admin-input bg-white">
              <option value="Dairy">Dairy</option>
              <option value="Fresh Milk">Fresh Milk</option>
              <option value="Ghee & Butter">Ghee & Butter</option>
              <option value="Paneer & Curd">Paneer & Curd</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Price (₹) *</label>
            <input type="number" step="0.5" id="prod-price" placeholder="70.00" class="admin-input" />
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Unit</label>
            <select id="prod-unit" class="admin-input bg-white">
              <option value="litre">Litre</option>
              <option value="kg">Kilogram</option>
              <option value="ml">Millilitre</option>
              <option value="gram">Gram</option>
              <option value="piece">Piece</option>
            </select>
          </div>
          <div class="flex items-center space-x-2 pt-2 sm:pt-4">
            <input type="checkbox" id="prod-sub" checked class="rounded border-slate-300 text-brand" />
            <label for="prod-sub" class="text-xs text-slate-700 leading-tight cursor-pointer">Eligible for Subscriptions</label>
          </div>
        </div>
      </div>

      <div class="flex items-center space-x-2 pt-2 border-t border-slate-100">
        <button onclick="submitCreateProduct()" class="flex-1 bg-brand hover:bg-brand-dark text-white font-bold py-2.5 px-4 rounded-xl transition text-xs shadow-xs flex items-center justify-center space-x-1.5">
          <i data-lucide="check" class="w-4 h-4"></i>
          <span>Save Product</span>
        </button>
        <button onclick="closeCreateProductModal()" class="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 text-xs font-semibold transition">
          Cancel
        </button>
      </div>
    </div>
  </div>

<!-- MODAL: Edit Dairy Product -->
  <div id="edit-product-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden">
    <div class="modal-dialog max-w-md w-full p-6 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div class="flex items-center space-x-2.5">
          <div class="w-8 h-8 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center">
            <i data-lucide="edit" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="text-base font-bold text-slate-900">Edit Dairy Product</h3>
            <p class="text-[11px] text-slate-500">Update pricing, category, and eligibility</p>
          </div>
        </div>
        <button onclick="closeEditProductModal()" class="modal-close-btn">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <input type="hidden" id="edit-prod-id" />
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Product Name *</label>
          <input type="text" id="edit-prod-name" class="admin-input" />
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Category</label>
            <select id="edit-prod-category" class="admin-input bg-white">
              <option value="Dairy">Dairy</option>
              <option value="Fresh Milk">Fresh Milk</option>
              <option value="Ghee & Butter">Ghee & Butter</option>
              <option value="Paneer & Curd">Paneer & Curd</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Price (₹) *</label>
            <input type="number" step="0.5" id="edit-prod-price" class="admin-input" />
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Unit</label>
            <select id="edit-prod-unit" class="admin-input bg-white">
              <option value="litre">Litre</option>
              <option value="kg">Kilogram</option>
              <option value="ml">Millilitre</option>
              <option value="gram">Gram</option>
              <option value="piece">Piece</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Active Status</label>
            <select id="edit-prod-status" class="admin-input bg-white">
              <option value="true">Active</option>
              <option value="false">Disabled</option>
            </select>
          </div>
        </div>
        <div class="flex items-center space-x-2 pt-1">
          <input type="checkbox" id="edit-prod-sub" class="rounded border-slate-300 text-brand" />
          <label for="edit-prod-sub" class="text-xs text-slate-700 leading-tight cursor-pointer">Eligible for Subscriptions</label>
        </div>
      </div>

      <div class="flex items-center space-x-2 pt-2 border-t border-slate-100">
        <button onclick="submitUpdateProduct()" class="flex-1 bg-brand hover:bg-brand-dark text-white font-bold py-2.5 px-4 rounded-xl transition text-xs shadow-xs flex items-center justify-center space-x-1.5">
          <i data-lucide="check" class="w-4 h-4"></i>
          <span>Save Changes</span>
        </button>
        <button onclick="closeEditProductModal()" class="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 text-xs font-semibold transition">
          Cancel
        </button>
      </div>
    </div>
  </div>

<!-- MODAL: Category Add / Edit -->
  <div id="category-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden">
    <div class="modal-dialog max-w-md w-full p-6 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div class="flex items-center space-x-2.5">
          <div class="w-8 h-8 rounded-xl bg-brand-surface text-brand flex items-center justify-center">
            <i data-lucide="layers" class="w-4 h-4"></i>
          </div>
          <h3 class="text-base font-bold text-slate-900" id="cat-modal-title">Add Category</h3>
        </div>
        <button onclick="closeCategoryModal()" class="modal-close-btn"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <input type="hidden" id="cat-id" />
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Category Name *</label>
          <input type="text" id="cat-name" placeholder="e.g. Milk & Cream" class="admin-input" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Description</label>
          <textarea id="cat-desc" rows="2" placeholder="Brief description..." class="admin-input"></textarea>
        </div>
        <div class="flex items-center space-x-2 pt-1">
          <input type="checkbox" id="cat-active" checked class="rounded border-slate-300 text-brand" />
          <label for="cat-active" class="text-xs text-slate-700 cursor-pointer">Active</label>
        </div>
      </div>
      <div class="flex items-center space-x-2 pt-2 border-t border-slate-100">
        <button onclick="submitSaveCategory()" class="flex-1 bg-brand hover:bg-brand-dark text-white font-bold py-2.5 px-4 rounded-xl text-xs transition shadow-xs flex items-center justify-center space-x-1.5">
          <i data-lucide="check" class="w-4 h-4"></i>
          <span>Save Category</span>
        </button>
        <button onclick="closeCategoryModal()" class="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 text-xs font-semibold transition">Cancel</button>
      </div>
    </div>
  </div>
