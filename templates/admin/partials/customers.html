<!-- SECTION 5: CUSTOMERS -->
      <div id="content-customers" class="space-y-4 hidden">
        <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h3 class="text-base font-bold text-slate-900">Registered Customers</h3>
              <p class="text-xs text-slate-500">Customer profiles, delivery addresses, order & subscription history, and account status.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <div class="inline-flex rounded-lg border border-slate-200 p-0.5 bg-slate-50 text-xs">
                <button onclick="filterCustomerStatus('all')" id="customer-filter-all" class="px-2.5 py-1 rounded-md font-semibold bg-white text-slate-900 shadow-xs transition">All</button>
                <button onclick="filterCustomerStatus('active')" id="customer-filter-active" class="px-2.5 py-1 rounded-md font-medium text-slate-600 hover:text-slate-900 transition">Active</button>
                <button onclick="filterCustomerStatus('inactive')" id="customer-filter-inactive" class="px-2.5 py-1 rounded-md font-medium text-slate-600 hover:text-slate-900 transition">Inactive</button>
              </div>
              <div class="search-input-wrapper w-full sm:w-56">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="customer-search-input" oninput="handleCustomerSearch(this.value)" placeholder="Search name, mobile, area..." />
              </div>
              <button onclick="openCreateCustomerModal()" class="bg-brand hover:bg-brand-dark text-white font-bold py-2 px-3.5 rounded-xl transition text-xs shadow-xs flex items-center space-x-1.5 whitespace-nowrap">
                <i data-lucide="user-plus" class="w-4 h-4"></i>
                <span>Add Customer</span>
              </button>
            </div>
          </div>

          <div class="overflow-x-auto rounded-xl border border-slate-200">
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold uppercase tracking-wider text-[11px]">
                  <th class="py-3 px-4">Customer Name</th>
                  <th class="py-3 px-4">Mobile</th>
                  <th class="py-3 px-4">Delivery Address & Area</th>
                  <th class="py-3 px-4">Referral Code</th>
                  <th class="py-3 px-4">Orders</th>
                  <th class="py-3 px-4">Status</th>
                  <th class="py-3 px-4 text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="customers-table-body" class="divide-y divide-slate-100">
                <tr>
                  <td colspan="7" class="text-center py-8 text-slate-400">Loading customers...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
