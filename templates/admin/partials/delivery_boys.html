<!-- SECTION 4: DELIVERY BOYS & CASH IN HAND -->
      <div id="content-delivery-boys" class="space-y-4 hidden">
        <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h3 class="text-base font-bold text-slate-900">Delivery Personnel & Cash in Hand</h3>
              <p class="text-xs text-slate-500">Track pending cash balances collected by each partner during daily runs.</p>
            </div>
            <button onclick="openCreateBoyModal()" class="flex items-center space-x-1.5 px-3.5 py-2 rounded-xl bg-brand hover:bg-brand-dark text-white text-xs font-semibold transition shadow-xs">
              <i data-lucide="user-plus" class="w-4 h-4"></i>
              <span>Add Delivery Partner</span>
            </button>
          </div>

          <!-- Filter & Search Toolbar for Delivery Partners -->
          <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-slate-100">
            <div class="flex items-center space-x-2">
              <span class="text-xs font-semibold text-slate-500">Duty Status:</span>
              <div class="inline-flex rounded-lg border border-slate-200 p-0.5 bg-slate-50 text-xs">
                <button onclick="filterBoyStatus('all')" id="boy-filter-all" class="px-2.5 py-1 rounded-md font-semibold bg-white text-slate-900 shadow-xs transition">All</button>
                <button onclick="filterBoyStatus('on_duty')" id="boy-filter-on_duty" class="px-2.5 py-1 rounded-md font-medium text-slate-600 hover:text-slate-900 transition">● On Duty</button>
                <button onclick="filterBoyStatus('off_duty')" id="boy-filter-off_duty" class="px-2.5 py-1 rounded-md font-medium text-slate-600 hover:text-slate-900 transition">○ Off Duty</button>
              </div>
            </div>
            <div class="search-input-wrapper w-full sm:w-64">
              <i data-lucide="search" class="search-icon"></i>
              <input type="text" id="boy-search-input" onkeyup="debounceBoySearch()" placeholder="Search partner, mobile, zone..." />
            </div>
          </div>

          <div class="overflow-x-auto rounded-xl border border-slate-200">
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold uppercase tracking-wider text-[11px]">
                  <th class="py-3 px-4">Partner Name</th>
                  <th class="py-3 px-4">Mobile (Login)</th>
                  <th class="py-3 px-4">Zone & Vehicle</th>
                  <th class="py-3 px-4">Duty Status</th>
                  <th class="py-3 px-4">Cash in Hand</th>
                  <th class="py-3 px-4">Completed Drops</th>
                  <th class="py-3 px-4 text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="delivery-boys-table-body" class="divide-y divide-slate-100">
                <tr>
                  <td colspan="7" class="text-center py-8 text-slate-400">Loading delivery personnel...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
