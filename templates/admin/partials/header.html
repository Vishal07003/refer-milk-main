<!-- Top Navigation Header -->
    <header class="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between shrink-0">
      <div class="flex items-center space-x-3">
        <button onclick="toggleSidebar()" class="text-slate-500 hover:text-slate-700 p-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 transition">
          <i data-lucide="menu" class="w-4 h-4"></i>
        </button>
        <div>
          <span class="text-sm font-extrabold text-slate-900 tracking-tight" id="section-header-title">Operations & Cash Management Hub</span>
          <p class="text-[11px] text-emerald-700 font-medium">Strictly Cash-Only Business Operations (Cash at Delivery)</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <button onclick="refreshAllData()" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 text-slate-600 text-xs font-semibold transition shadow-xs">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5 text-slate-500" id="refresh-icon"></i>
          <span>Sync Real Data</span>
        </button>
        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-200">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-600 mr-1 animate-pulse"></span>
          Live DB Connected
        </span>
        <form method="POST" action="/dairypanel/logout/" class="inline m-0 p-0">
          {% csrf_token %}
          <button type="submit" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg border border-rose-200 bg-rose-50/50 hover:bg-rose-50 text-rose-700 text-xs font-semibold transition shadow-xs cursor-pointer" title="Log out of Admin Panel">
            <i data-lucide="log-out" class="w-3.5 h-3.5 text-rose-600"></i>
            <span>Logout</span>
          </button>
        </form>
      </div>
    </header>
