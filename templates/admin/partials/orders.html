<!-- SECTION 3: ORDERS & DISPATCH -->
      <div id="content-orders" class="space-y-4 hidden">
        <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h3 class="text-base font-bold text-slate-900">All Customer Orders & Dispatch</h3>
              <p class="text-xs text-slate-500">Monitor milk orders, assign delivery boys, track cash, update status, and cancel safely.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <div class="flex items-center space-x-1.5">
                <label for="orders-status-filter" class="text-xs font-semibold text-slate-500 whitespace-nowrap">Status:</label>
                <select id="orders-status-filter" onchange="filterOrdersStatus(this.value)" class="text-xs py-2 px-3 rounded-xl border border-slate-200 bg-white text-slate-700 focus:outline-none focus:ring-1 focus:ring-brand font-medium">
                  <option value="all">All Orders</option>
                  <option value="pending">Pending</option>
                  <option value="confirmed">Confirmed</option>
                  <option value="processing">Processing</option>
                  <option value="out_for_delivery">Out for Delivery</option>
                  <option value="delivered">Delivered</option>
                  <option value="cancelled">Cancelled</option>
                </select>
              </div>
              <div class="search-input-wrapper w-full sm:w-64">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="order-search-input" onkeyup="debounceOrderSearch()" placeholder="Search Order #, Customer, Mobile..." />
              </div>
            </div>
          </div>

          <div class="overflow-x-auto rounded-xl border border-slate-200">
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold uppercase tracking-wider text-[11px]">
                  <th class="py-3 px-4">Order #</th>
                  <th class="py-3 px-4">Customer</th>
                  <th class="py-3 px-4">Items Summary</th>
                  <th class="py-3 px-4">Amount</th>
                  <th class="py-3 px-4">Assigned Partner</th>
                  <th class="py-3 px-4">Payment</th>
                  <th class="py-3 px-4">Status</th>
                  <th class="py-3 px-4 text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="orders-table-body" class="divide-y divide-slate-100">
                <tr>
                  <td colspan="8" class="text-center py-8 text-slate-400">Loading orders...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
