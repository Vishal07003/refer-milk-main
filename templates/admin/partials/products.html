<!-- SECTION 7: PRODUCTS -->
      <div id="content-products" class="space-y-4 hidden">
        <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h3 class="text-base font-bold text-slate-900">Dairy Products Catalog</h3>
              <p class="text-xs text-slate-500">Manage milk, ghee, paneer, and prices per unit.</p>
            </div>
            <button onclick="openCreateProductModal()" class="flex items-center space-x-1.5 px-3.5 py-2 rounded-xl bg-brand hover:bg-brand-dark text-white text-xs font-semibold transition shadow-xs">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span>Add New Product</span>
            </button>
          </div>

          <!-- Filter & Search Toolbar for Products -->
          <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-slate-100">
            <div class="flex flex-wrap items-center gap-2">
              <div class="flex items-center space-x-1.5">
                <label for="prod-category-filter" class="text-xs font-semibold text-slate-500 whitespace-nowrap">Category:</label>
                <select id="prod-category-filter" onchange="filterProducts()" class="text-xs py-2 px-3 rounded-xl border border-slate-200 bg-white text-slate-700 focus:outline-none focus:ring-1 focus:ring-brand font-medium">
                  <option value="all">All Categories</option>
                </select>
              </div>
              <div class="inline-flex rounded-lg border border-slate-200 p-0.5 bg-slate-50 text-xs">
                <button onclick="filterProductStatus('all')" id="prod-filter-all" class="px-2.5 py-1 rounded-md font-semibold bg-white text-slate-900 shadow-xs transition">All</button>
                <button onclick="filterProductStatus('active')" id="prod-filter-active" class="px-2.5 py-1 rounded-md font-medium text-slate-600 hover:text-slate-900 transition">Active</button>
                <button onclick="filterProductStatus('inactive')" id="prod-filter-inactive" class="px-2.5 py-1 rounded-md font-medium text-slate-600 hover:text-slate-900 transition">Disabled</button>
              </div>
            </div>
            <div class="search-input-wrapper w-full sm:w-64">
              <i data-lucide="search" class="search-icon"></i>
              <input type="text" id="prod-search-input" onkeyup="debounceProductSearch()" placeholder="Search product name, description..." />
            </div>
          </div>

          <div class="overflow-x-auto rounded-xl border border-slate-200">
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold uppercase tracking-wider text-[11px]">
                  <th class="py-3 px-4">Product Name</th>
                  <th class="py-3 px-4">Category</th>
                  <th class="py-3 px-4">Price / Unit</th>
                  <th class="py-3 px-4">Subscription Eligible</th>
                  <th class="py-3 px-4">Status</th>
                  <th class="py-3 px-4 text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="products-table-body" class="divide-y divide-slate-100">
                <tr>
                  <td colspan="6" class="text-center py-8 text-slate-400">Loading products...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
