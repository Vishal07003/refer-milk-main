<!-- Left Sidebar (Collapsible / Modern SaaS Layout) -->
  <aside id="admin-sidebar" class="w-64 bg-slate-900 text-slate-300 flex flex-col h-screen shrink-0 transition-all duration-300 z-50">
    <!-- Brand Header (Fixed at top) -->
    <div class="h-16 px-5 flex items-center justify-between border-b border-slate-800 shrink-0">
      <div class="flex items-center space-x-3 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-brand flex items-center justify-center text-white shadow-sm shadow-brand/40 shrink-0">
          <i data-lucide="milk" class="w-5 h-5"></i>
        </div>
        <div class="min-w-0 truncate">
          <h1 class="font-extrabold text-sm text-white tracking-tight leading-none truncate">DudhDairy</h1>
          <span class="text-[10px] text-emerald-400 font-semibold tracking-wider uppercase block truncate">Admin Hub</span>
        </div>
      </div>
      <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition shrink-0" title="Close navigation">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Navigation Links (Independently scrollable) -->
    <nav class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden p-3 space-y-1 text-xs sidebar-scrollbar">
      <button onclick="switchTab('dashboard')" id="nav-btn-dashboard" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-semibold bg-brand text-white shadow-xs transition whitespace-nowrap">
        <i data-lucide="layout-dashboard" class="w-4 h-4 shrink-0"></i>
        <span class="truncate">Dashboard & KPIs</span>
      </button>

      <button onclick="switchTab('cash-handover')" id="nav-btn-cash-handover" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition whitespace-nowrap">
        <i data-lucide="hand-coins" class="w-4 h-4 shrink-0"></i>
        <span class="truncate">Cash Handover & Reconcile</span>
      </button>

      <button onclick="switchTab('offline-payments')" id="nav-btn-offline-payments" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition whitespace-nowrap">
        <i data-lucide="badge-dollar-sign" class="w-4 h-4 shrink-0"></i>
        <span class="truncate">Order Cash Collections</span>
      </button>

      <button onclick="switchTab('orders')" id="nav-btn-orders" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition whitespace-nowrap">
        <i data-lucide="shopping-cart" class="w-4 h-4 shrink-0"></i>
        <span class="truncate">Orders & Dispatch</span>
      </button>

      <button onclick="switchTab('delivery-boys')" id="nav-btn-delivery-boys" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition whitespace-nowrap">
        <i data-lucide="truck" class="w-4 h-4 shrink-0"></i>
        <span class="truncate">Delivery Boys & Cash</span>
      </button>

      <button onclick="switchTab('customers')" id="nav-btn-customers" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition whitespace-nowrap">
        <i data-lucide="users" class="w-4 h-4 shrink-0"></i>
        <span class="truncate">Customers</span>
      </button>

      <button onclick="switchTab('subscription-plans')" id="nav-btn-subscription-plans" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition whitespace-nowrap">
        <i data-lucide="sparkles" class="w-4 h-4 shrink-0"></i>
        <span class="truncate">Subscription Plans</span>
      </button>

      <button onclick="switchTab('delivery-slots')" id="nav-btn-delivery-slots" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition whitespace-nowrap">
        <i data-lucide="clock" class="w-4 h-4 shrink-0"></i>
        <span class="truncate">Delivery Slots</span>
      </button>

      <button onclick="switchTab('subscriptions')" id="nav-btn-subscriptions" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition whitespace-nowrap">
        <i data-lucide="calendar-clock" class="w-4 h-4 shrink-0"></i>
        <span class="truncate">Customer Subscriptions</span>
      </button>

      <button onclick="switchTab('vacations')" id="nav-btn-vacations" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition whitespace-nowrap">
        <div class="flex items-center space-x-3 min-w-0">
          <i data-lucide="palmtree" class="w-4 h-4 text-amber-400 shrink-0"></i>
          <span class="truncate">Vacation Mode</span>
        </div>
        <span id="sidebar-vacations-badge" class="hidden px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30 shrink-0">0</span>
      </button>

      <button onclick="switchTab('products')" id="nav-btn-products" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition whitespace-nowrap">
        <i data-lucide="package" class="w-4 h-4 shrink-0"></i>
        <span class="truncate">Products Catalog</span>
      </button>

      <button onclick="switchTab('categories')" id="nav-btn-categories" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition whitespace-nowrap">
        <i data-lucide="layers" class="w-4 h-4 shrink-0"></i>
        <span class="truncate">Categories</span>
      </button>

      <button onclick="switchTab('referrals')" id="nav-btn-referrals" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition whitespace-nowrap">
        <i data-lucide="share-2" class="w-4 h-4 shrink-0"></i>
        <span class="truncate">Referral Program</span>
      </button>

      <button onclick="switchTab('notifications')" id="nav-btn-notifications" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition whitespace-nowrap">
        <i data-lucide="bell" class="w-4 h-4 shrink-0"></i>
        <span class="truncate">Notifications</span>
      </button>

      <button onclick="switchTab('recycle-bin')" id="nav-btn-recycle-bin" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition whitespace-nowrap">
        <div class="flex items-center space-x-3 min-w-0">
          <i data-lucide="trash-2" class="w-4 h-4 text-rose-400 shrink-0"></i>
          <span class="truncate">Recycle Bin</span>
        </div>
        <span id="recycle-bin-badge" class="hidden px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30 shrink-0">0</span>
      </button>

      <button onclick="switchTab('settings')" id="nav-btn-settings" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition whitespace-nowrap">
        <i data-lucide="settings" class="w-4 h-4 shrink-0"></i>
        <span class="truncate">Settings & Audit</span>
      </button>

      <button onclick="switchTab('reports')" id="nav-btn-reports" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition whitespace-nowrap">
        <i data-lucide="bar-chart-3" class="w-4 h-4 shrink-0"></i>
        <span class="truncate">Reports & Ledger</span>
      </button>

      <!-- User / Admin Info and Logout at bottom of scrollable nav -->
      <div class="pt-3 mt-3 border-t border-slate-800 space-y-2">
        <div class="flex items-center space-x-3 p-2 rounded-xl bg-slate-800/60 min-w-0">
          <div class="w-8 h-8 rounded-full bg-brand/30 text-emerald-400 font-bold flex items-center justify-center text-xs shrink-0">
            AD
          </div>
          <div class="flex-1 min-w-0">
            <p class="font-bold text-white text-xs truncate leading-tight">Super Administrator</p>
            <p class="text-slate-400 text-[10px] truncate leading-tight">Sangola Central Hub</p>
          </div>
        </div>
        <form method="POST" action="/dairypanel/logout/" class="w-full m-0 p-0">
          {% csrf_token %}
          <button type="submit" class="w-full flex items-center justify-center space-x-2 px-3 py-2 rounded-xl text-xs font-semibold text-rose-400 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 transition cursor-pointer whitespace-nowrap" title="Log out of Admin Panel">
            <i data-lucide="log-out" class="w-3.5 h-3.5 shrink-0"></i>
            <span class="truncate">Logout Admin</span>
          </button>
        </form>
      </div>
    </nav>
  </aside>
